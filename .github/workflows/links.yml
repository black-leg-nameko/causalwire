name: Links

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Product Hunt and X policy pages return 403 to non-browser clients; 404/5xx still fail.
          args: --verbose --no-progress --accept 200,403,429 "**/*.md"
          fail: true
