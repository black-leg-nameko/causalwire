name: Feature request
description: Propose a scoped improvement that respects the MVP boundary
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: job
    attributes:
      label: User job and failure mode
      description: What protocol-debugging task cannot be completed today?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Wire-verifiable evidence
      description: What evidence would causalwire observe without semantic guessing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope check
      options:
        - label: I reviewed the SPEC non-goals and explained any overlap.
          required: true
        - label: This proposal does not require automatic content upload or implicit full-content capture.
          required: true
