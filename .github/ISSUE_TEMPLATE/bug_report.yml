name: Bug report
description: Report a reproducible causalwire defect
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not attach private journals, full-content MCP traffic, credentials, or security vulnerabilities. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: causalwire version
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: Node 22.23.1 on macOS 15.6
    validations:
      required: true
  - type: dropdown
    id: content
    attributes:
      label: Capture content mode
      options: [off, full, not applicable]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal safe reproduction
      description: Use synthetic or fully consented data. Include exact commands and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, private payloads, client names, internal URLs, and plaintext request IDs.
          required: true
        - label: This is not a security vulnerability.
          required: true
